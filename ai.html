<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MereMoth AI Admin</title>
<style>
body{font-family:system-ui;background:#0f172a;color:white;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px}
input,button,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0}
button{background:#3b82f6;color:white;font-weight:bold}
h1{color:#60a5fa}
</style>
</head>
<body>
<h1>🤖 MereMoth AI Admin</h1>
<div class="card">
<h3>AI Command</h3>
<textarea id="cmd" rows="3" placeholder="Type command... e.g. create new hero section"></textarea>
<button onclick="run()">Execute AI</button>
<p id="out"></p>
</div>
<div class="card">
<h3>Quick Links</h3>
<p>✅ Cloudflare Connected<br>✅ Build Green<br>✅ Site Live: meremothmall.com</p>
<a href="/" style="color:#60a5fa">← Back to Store</a>
</div>
<script>
function run(){
 document.getElementById('out').innerText='AI Ready! Command: '+document.getElementById('cmd').value+' - Connect this to your AI backend later.';
}
</script>
</body>
</html>
